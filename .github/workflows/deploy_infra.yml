name: Deploy Infrastructure
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      stack_name:
        required: false
        type: string
        default: "*"
      working_dir:
        required: false
        type: string
        default: ./infra
      project_id:
        required: true
        type: string
      gcp_region:
        required: true
        type: string
      gcp_tf_bucket_name:
        required: true
        type: string
      gcp_registry_name:
        required: true
        type: string
      gcp_zone:
        required: false
        type: string
      gcp_registry_hostname:
        required: false
        type: string
      extra_env_vars:
        required: false
        type: string
      node_version:
        required: false
        type: string
        default: '24'
    secrets:
        GCP_SERVICE_ACCOUNT_FILE:
          required: true
        GITUB_ACCESS_TOKEN:
          required: true
        GITUB_SSH_KEY:
          required: false
        extra_secrets:
          required: false
jobs:
  setup_infra:
    runs-on: ubuntu-latest
    steps:
      - name: Set environment variables
        run: |
          echo "ENVIRONMENT=${{ inputs.environment }}" >> $GITHUB_ENV
          echo "VARIABLES_CONFIG_PATH=${{ inputs.environment }}" >> $GITHUB_ENV
          echo "GCP_PROJECT_ID=${{ inputs.project_id }}" >> $GITHUB_ENV
          echo "GCP_REGION=${{ inputs.gcp_region }}" >> $GITHUB_ENV
          echo "GCP_ZONE=${{ inputs.gcp_zone }}" >> $GITHUB_ENV
          echo "GCP_TF_BUCKET_NAME=${{ inputs.gcp_tf_bucket_name }}" >> $GITHUB_ENV
          echo "GCP_CONTAINER_REGISTRY_NAME=${{ inputs.gcp_registry_name }}" >> $GITHUB_ENV
          echo "GCP_CONTAINER_REGISTRY_HOSTNAME=${{ inputs.gcp_registry_hostname }}" >> $GITHUB_ENV

      - name: Set extra environment variables
        if: ${{ inputs.extra_env_vars != '' }}
        run: |
          echo "${{ inputs.extra_env_vars }}" | tr ',' '\n' | while read -r var; do
            echo "$var" >> $GITHUB_ENV
          done

      - name: Set extra secrets
        run: |
          if [ -n "${{ secrets.extra_secrets }}" ]; then
            echo "${{ secrets.extra_secrets }}" | tr ',' '\n' | while read -r secret; do
              echo "$secret" >> $GITHUB_ENV
            done
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          project_id: ${{ inputs.project_id }}
          token_format: access_token

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Set up Git credentials
        run: |
          git config --global url.https://${{ secrets.GITUB_ACCESS_TOKEN }}@github.com/.insteadOf ssh://git@github.com/

      - name: Setup Github SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITUB_SSH_KEY }}

      - name: Install dependencies
        working-directory: ${{ inputs.working_dir }}
        run: |
          npm install
          npm run build

      - name: Set Terraform Up
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Run CDK Terrain
        working-directory: ${{ inputs.working_dir }}
        env:
          CI: "true"
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            npx --yes cdktn-cli@0.24.0 deploy '${{ inputs.stack_name }}' --auto-approve
          else
            npx --yes cdktn-cli@0.24.0 diff '${{ inputs.stack_name }}'
          fi
